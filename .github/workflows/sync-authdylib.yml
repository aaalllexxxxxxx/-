name: Sync AuthDylib

# 定时检测 AuthDylib 仓库更新，自动同步卡密验证源码到 src/auth/
# 若 AuthDylib 是私有仓库，需在 Secrets 配置 AUTH_REPO_PAT（有 repo 权限的 PAT）
on:
  schedule:
    - cron: "17 */6 * * *"   # 每 6 小时检查一次
  workflow_dispatch:          # 也支持手动触发

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Clone AuthDylib
        env:
          PAT: ${{ secrets.AUTH_REPO_PAT }}
        run: |
          if [ -n "$PAT" ]; then
            git clone --depth 1 "https://x-access-token:${PAT}@github.com/aaalllexxxxxxx/AuthDylib.git" /tmp/authdylib
          else
            git clone --depth 1 "https://github.com/aaalllexxxxxxx/AuthDylib.git" /tmp/authdylib
          fi
          echo "upstream_sha=$(git -C /tmp/authdylib rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Sync sources
        run: |
          cp /tmp/authdylib/Sources/*.mm /tmp/authdylib/Sources/*.h /tmp/authdylib/Config.h src/auth/
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_ENV"
            echo "already up to date (${{ env.upstream_sha }})"
          else
            echo "changed=true" >> "$GITHUB_ENV"
          fi

      - name: Commit and push
        if: env.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/auth/
          git commit -m "chore: sync AuthDylib @ ${{ env.upstream_sha }}

          $(git -C /tmp/authdylib log --oneline -1 --format=%s)"
          git push

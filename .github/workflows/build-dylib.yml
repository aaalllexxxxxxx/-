# GitHub Actions: 自动编译 card_auth.dylib (arm64-apple-ios)
#
# 此 workflow 在 macOS runner 上使用 Xcode 工具链交叉编译 arm64 iOS dylib。
# 触发条件: push 到 main/master 分支, 或手动 dispatch。
#
# 编译产物: card_auth.dylib (arm64, 已 ldid 签名)
# 编译目标: arm64-apple-ios
# 依赖: UIKit, Security.framework, Foundation, CommonCrypto

name: Build card_auth.dylib

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'card_auth.c'
      - '.github/workflows/build-dylib.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'card_auth.c'
  workflow_dispatch:  # 允许手动触发

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Install ldid (for codesigning dylib)
        run: |
          brew install ldid 2>/dev/null || true
          which ldid && ldid 2>&1 | head -1 || echo "ldid not found, will use codesign"

      - name: Compile card_auth.dylib (arm64-apple-ios)
        run: |
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using SDK: $SDK_PATH"

          # 编译 dylib
          clang \
            -arch arm64 \
            -isysroot "$SDK_PATH" \
            -dynamiclib \
            -framework UIKit \
            -framework Security \
            -framework Foundation \
            -framework SystemConfiguration \
            -I"$SDK_PATH/System/Library/Frameworks/CommonCrypto.framework/Headers" \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -O2 \
            -Wno-deprecated-declarations \
            -Wno-unused-function \
            -Wno-unused-variable \
            card_auth.c \
            -o card_auth.dylib

          echo "=== 编译完成 ==="
          file card_auth.dylib
          otool -L card_auth.dylib
          echo "=== Load Commands ==="
          otool -l card_auth.dylib | grep -A5 LC_LOAD

      - name: Sign dylib with ldid
        run: |
          # 使用 ldid 添加伪签名 (TrollStore 环境不需要有效签名)
          # ldid -S 添加空 entitlements 签名, 巨魔环境可用
          if command -v ldid &>/dev/null; then
            ldid -S card_auth.dylib
            echo "=== ldid 签名完成 ==="
          else
            echo "ldid 不可用, 尝试 codesign"
            codesign -f -s - card_auth.dylib 2>/dev/null || echo "codesign 也失败, 跳过签名 (TrollStore 可用未签名 dylib)"
          fi
          echo "=== 签名信息 ==="
          codesign -dvvv card_auth.dylib 2>&1 || true

      - name: Verify dylib architecture
        run: |
          echo "=== 验证 dylib 架构 ==="
          file card_auth.dylib
          echo ""
          echo "=== 验证依赖库 ==="
          otool -L card_auth.dylib
          echo ""
          echo "=== 验证 Load Commands ==="
          otool -l card_auth.dylib | grep -A2 LC_LOAD_DYLIB || echo "无额外 LC_LOAD_DYLIB (正常)"

      - name: Upload card_auth.dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: card_auth.dylib
          path: card_auth.dylib
          retention-days: 30

      - name: Create release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: card_auth.dylib
          name: card_auth.dylib ${{ github.ref_name }}
          body: |
            ## card_auth.dylib ${{ github.ref_name }}

            ### 编译信息
            - 架构: arm64-apple-ios
            - 最低系统: iOS 15.0
            - 依赖: UIKit, Security, Foundation, CommonCrypto

            ### 部署方法
            1. **调试**: 使用 TrollFools 原地注入, 将 card_auth.dylib 放到注入列表第一位
            2. **正式**: 解压 IPA, 拷贝 dylib, optool 添加 LC_LOAD_DYLIB, ldid 回写 entitlements, 重新打包

            ### 卡密生成
            使用 gen_card.py 生成卡密:
            ```
            python gen_card.py --prefix D1 --type G
            python gen_card.py --prefix D1 --type B --device XXXXXXXX-XXXX-XXXX-XXXX-XXXXXXXXXXXX
            ```
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

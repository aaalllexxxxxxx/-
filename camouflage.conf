# camouflage.conf - 注入时的伪装命名配置
# 所有文件进入 ipa 前按此改名，配合 guard 的运行时发现机制（magic 扫描 + 体积识别），
# 改名不影响加载。按需修改成与你 App 业务风格一致的名字。
#
# 命名建议：
#   - 参考 App 内已有库的命名风格（如已有 libYogaKit.dylib，就用 libXXXKit.dylib）
#   - JS 密文伪装成资源文件最自然：.dat/.bin/.pak/.font 均可
#   - 避免 crypto/security/guard/frida/gadget/agent/hook 等敏感词

# 验证 dylib 注入后的名字（必须 .dylib 结尾）
GUARD_NAME=libimgpipeline.dylib

# FridaGadget 注入后的名字（必须 .dylib 结尾；其配置文件自动取同 basename）
GADGET_NAME=libavmediacore.dylib

# JS 密文注入后的名字（任意扩展名，建议伪装成数据/资源文件）
JS_BLOB_NAME=pipeline_cache.bin

# loader 壳在 Frameworks 的静态文件名（Gadget 只按字节内容识别，后缀可任意伪装，避免 .js 特征）
JS_DOC_NAME=.pipeline_cache.dat

# ========== JS 调试开关 ==========
# false(默认/生产):loader 零痕迹,不输出 report/stage/弹窗代码
# true:输出带分阶段 UIAlertView 弹窗的调试 loader(真机定位 JS 加载链路用)
#   stage1 取密钥 / stage2 keystream / stage3 magic 校验 / stage4 eval
# 改完 push 或手动触发工作流即按此构建
JS_DEBUG_ALERTS=true
